name: Release cicwave to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Check if version already exists on PyPI
        id: check-pypi
        run: |
          # Check if this version already exists on PyPI
          if pip index versions cicwave 2>/dev/null | grep -q "${{ steps.version.outputs.version }}"; then
            echo "Version ${{ steps.version.outputs.version }} of cicwave already exists on PyPI"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.version.outputs.version }} is new, proceeding with release"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install package and dependencies
        if: steps.check-pypi.outputs.exists == 'false'
        run: |
          # Install package with all dependencies for testing
          # Use --no-deps for PySide6/PyOpenGL which aren't needed for unit tests
          pip install numpy pandas matplotlib click pyyaml
          pip install -e . --no-deps

      - name: Run tests
        if: steps.check-pypi.outputs.exists == 'false'
        run: |
          if [ -d "tests/unittests" ]; then
            python -m unittest discover -s tests/unittests/ -p 'test_*.py' -v
          else
            echo "No unit tests found, skipping"
          fi
      
      - name: Build package
        if: steps.check-pypi.outputs.exists == 'false'
        run: |
          # Clean previous builds
          rm -rf build/ dist/ src/*.egg-info/
          
          # Build the package
          python -m build
          
          # List built files
          ls -la dist/
      
      - name: Upload to PyPI
        if: steps.check-pypi.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
      
      - name: Create GitHub Release
        if: steps.check-pypi.outputs.exists == 'false' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: cicwave v${{ steps.version.outputs.version }}
          body: |
            Release of cicwave version ${{ steps.version.outputs.version }}
            
            ## Installation
            ```bash
            pip install cicwave==${{ steps.version.outputs.version }}
            ```
            
            ## Changes
            See commit history for detailed changes in this release.
          draft: false
          prerelease: false
      
      - name: Skip release (version exists)
        if: steps.check-pypi.outputs.exists == 'true'
        run: |
          echo "⚠️ Version ${{ steps.version.outputs.version }} already exists on PyPI. Skipping release."
          exit 0